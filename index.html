<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog (WASM)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    section { margin-bottom: 2rem; border-bottom: 1px solid #ddd; padding-bottom: 1rem; }
    label { display: block; margin-top: 0.5rem; }
    input, textarea, button { width: 100%; box-sizing: border-box; margin-top: 0.25rem; }
    textarea { min-height: 80px; }
    .post { border: 1px solid #ccc; padding: 0.75rem; margin: 0.5rem 0; border-radius: 6px; }
    .muted { color: #666; font-size: 0.9rem; }
    .error { color: #b00; }
    #auth-status { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Blog</h1>
  <p id="auth-status">Checking session…</p>
  <p id="msg" class="error"></p>

  <section id="guest-forms">
    <h2>Register</h2>
    <form id="form-register">
      <label>Username <input name="username" required /></label>
      <label>Email <input name="email" type="email" required /></label>
      <label>Password <input name="password" type="password" required /></label>
      <button type="submit">Register</button>
    </form>
    <h2>Login</h2>
    <form id="form-login">
      <label>Username <input name="username" required /></label>
      <label>Password <input name="password" type="password" required /></label>
      <button type="submit">Login</button>
    </form>
  </section>

  <section id="user-area" style="display:none;">
    <button type="button" id="btn-logout">Logout</button>
    <h2>New post</h2>
    <form id="form-post">
      <label>Title <input name="title" required /></label>
      <label>Content <textarea name="content" required></textarea></label>
      <button type="submit">Publish</button>
    </form>
  </section>

  <section>
    <h2>Posts</h2>
    <button type="button" id="btn-refresh">Refresh list</button>
    <div id="posts"></div>
  </section>

  <script type="module">
    import init, { BlogApp } from "./blog-wasm/pkg/blog_wasm.js";

    const API_BASE = "http://localhost:8080";
    const msg = document.getElementById("msg");
    const postsEl = document.getElementById("posts");
    const authStatus = document.getElementById("auth-status");
    const guestForms = document.getElementById("guest-forms");
    const userArea = document.getElementById("user-area");

    function showError(e) {
      msg.textContent = typeof e === "string" ? e : (e && e.message) || String(e);
    }
    function clearError() { msg.textContent = ""; }

    /** Normalize wasm-bindgen `JsValue` (object or JSON string). */
    function asObj(v) {
      if (v === undefined || v === null) return v;
      if (typeof v === "string") return JSON.parse(v);
      return v;
    }

    await init();
    const app = new BlogApp(API_BASE);

    function refreshAuthUi() {
      const ok = app.is_authenticated();
      authStatus.textContent = ok ? "Signed in" : "Not signed in";
      guestForms.style.display = ok ? "none" : "block";
      userArea.style.display = ok ? "block" : "none";
    }

    async function renderPosts() {
      clearError();
      try {
        const data = asObj(await app.load_posts());
        postsEl.innerHTML = "";
        const uid = app.is_authenticated() ? JSON.parse(sessionStorage.getItem("blog_user") || "{}").id : null;
        for (const p of data.posts) {
          const div = document.createElement("div");
          div.className = "post";
          div.dataset.id = p.id;
          div.innerHTML = `
            <div><strong>${escapeHtml(p.title)}</strong>
              <span class="muted">#${p.id} · author ${p.author_id}</span></div>
            <div>${escapeHtml(p.content)}</div>
          `;
          const actions = document.createElement("div");
          if (uid && uid === p.author_id) {
            const editBtn = document.createElement("button");
            editBtn.textContent = "Edit";
            editBtn.onclick = () => editPost(p);
            const delBtn = document.createElement("button");
            delBtn.textContent = "Delete";
            delBtn.onclick = () => deletePost(p.id);
            actions.append(editBtn, delBtn);
          }
          div.appendChild(actions);
          postsEl.appendChild(div);
        }
      } catch (e) {
        showError(e);
      }
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function editPost(p) {
      const title = prompt("Title", p.title);
      if (title === null) return;
      const content = prompt("Content", p.content);
      if (content === null) return;
      app.update_post(BigInt(p.id), title, content).then(() => renderPosts()).catch(showError);
    }

    function deletePost(id) {
      if (!confirm("Delete this post?")) return;
      app.delete_post(BigInt(id)).then(() => renderPosts()).catch(showError);
    }

    document.getElementById("form-register").onsubmit = async (ev) => {
      ev.preventDefault();
      clearError();
      const fd = new FormData(ev.target);
      try {
        const out = await app.register(fd.get("username"), fd.get("email"), fd.get("password"));
        const j = asObj(out);
        sessionStorage.setItem("blog_user", JSON.stringify(j.user));
        refreshAuthUi();
        renderPosts();
      } catch (e) { showError(e); }
    };

    document.getElementById("form-login").onsubmit = async (ev) => {
      ev.preventDefault();
      clearError();
      const fd = new FormData(ev.target);
      try {
        const out = await app.login(fd.get("username"), fd.get("password"));
        const j = asObj(out);
        sessionStorage.setItem("blog_user", JSON.stringify(j.user));
        refreshAuthUi();
        renderPosts();
      } catch (e) { showError(e); }
    };

    document.getElementById("btn-logout").onclick = () => {
      app.logout();
      sessionStorage.removeItem("blog_user");
      refreshAuthUi();
    };

    document.getElementById("form-post").onsubmit = async (ev) => {
      ev.preventDefault();
      clearError();
      const fd = new FormData(ev.target);
      try {
        await app.create_post(fd.get("title"), fd.get("content"));
        ev.target.reset();
        renderPosts();
      } catch (e) { showError(e); }
    };

    document.getElementById("btn-refresh").onclick = () => renderPosts();

    refreshAuthUi();
    renderPosts();
  </script>
</body>
</html>
